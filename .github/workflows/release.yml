name: Release

# Publishing a release vX.Y.Z attaches mtg-ledger-scan-X.Y.Z.tar.gz (the contents of dist/).
# mtg_ledger's Dockerfile downloads it at the version named by SCAN_VERSION.
on:
  release:
    types: [published]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          tar -czf "mtg-ledger-scan-${VERSION}.tar.gz" -C dist .
          gh release upload "$TAG" "mtg-ledger-scan-${VERSION}.tar.gz" --clobber
